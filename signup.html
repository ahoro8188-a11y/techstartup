<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — Nimbus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo"><span class="dot"></span>Nimbus</a>
    <nav class="nav-links" id="navLinks">
      <a href="index.html#features">Features</a>
      <a href="feedback.html">Feedback</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="nav-auth" id="navAuthSlot"></div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<section class="auth-page">
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="auth-sub">Start your free Nimbus workspace in seconds.</p>

    <div class="form-error" id="formError"></div>

    <form id="signupForm">
      <div class="form-group">
        <label for="name">Full name</label>
        <input type="text" id="name" required autocomplete="name">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Create account</button>
    </form>

    <p class="auth-footer">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</section>

<script type="module">
  import { auth } from "./firebaseinit.js";
  import {
    createUserWithEmailAndPassword,
    updateProfile
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const form = document.getElementById("signupForm");
  const errorBox = document.getElementById("formError");
  const submitBtn = document.getElementById("submitBtn");

  function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.add("show");
  }
  function clearError() {
    errorBox.classList.remove("show");
    errorBox.textContent = "";
  }

  const friendlyErrors = {
    "auth/email-already-in-use": "That email is already registered — try logging in instead.",
    "auth/invalid-email": "That email address doesn't look valid.",
    "auth/weak-password": "Password should be at least 6 characters.",
  };

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearError();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
      showError("Passwords don't match.");
      return;
    }

    submitBtn.classList.add("btn-loading");
    submitBtn.textContent = "Creating account…";

    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await updateProfile(cred.user, { displayName: name });
      window.location.href = "dashboard.html";
    } catch (err) {
      showError(friendlyErrors[err.code] || "Something went wrong. Please try again.");
      submitBtn.classList.remove("btn-loading");
      submitBtn.textContent = "Create account";
    }
  });
</script>

<script type="module" src="auth.js"></script>
<script src="script.js"></script>
</body>
</html>
