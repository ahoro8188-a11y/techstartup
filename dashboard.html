<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Nimbus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-protected="true">

<header class="site-nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo"><span class="dot"></span>Nimbus</a>
    <nav class="nav-links" id="navLinks">
      <a href="dashboard.html">Dashboard</a>
      <a href="feedback.html">Feedback</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="nav-auth" id="navAuthSlot"></div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<section class="dashboard">
  <div class="dashboard-head">
    <h1>Welcome back 👋</h1>
    <p>Here's what's happening with your workspace.</p>
  </div>

  <div class="dashboard-grid">
    <div class="stat-card">
      <p class="stat-label">Active projects</p>
      <p class="stat-value">3</p>
    </div>
    <div class="stat-card">
      <p class="stat-label">Tasks completed</p>
      <p class="stat-value">27</p>
    </div>
    <div class="stat-card">
      <p class="stat-label">Team members</p>
      <p class="stat-value">5</p>
    </div>
  </div>

  <div class="account-card">
    <h2>Account details</h2>
    <div class="account-row">
      <span class="label">Email</span>
      <span id="userEmail">—</span>
    </div>
    <div class="account-row">
      <span class="label">Member since</span>
      <span id="userCreated">—</span>
    </div>
    <div class="account-row">
      <span class="label">Plan</span>
      <span>Free</span>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="footer-bottom">
    <p>© 2026 Nimbus Inc.</p>
    <div class="footer-links">
      <a href="feedback.html">Feedback</a>
      <a href="contact.html">Contact</a>
    </div>
  </div>
</footer>

<script type="module" src="auth.js"></script>
<script src="script.js"></script>
</body>
</html>
